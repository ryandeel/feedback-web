<form id="frmDashboard" style="display: none;">
    <div class="card col-12">
        <div class="card-body">
            <h2 class="text-center" style="color: #5651a7;">Dashboard</h2>
            <div class="card">
                <div class="card-body">
                    <div id="divClasses" class="d-flex flex-column gap-2">
                        <!-- Classes will be dynamically added here -->
                         <h3 class="text-center" style="color: #5651a7;">No classes added yet!</h3>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 w-50">
                <button id="btnJoinClass" class="btn btn-primary col-12 mt-2" type="button" style="background-color: #5651a7; border-color: #5651a7; display:inline-block;">Join Class</button>
                <button id="btnCreateClass" class="btn btn-primary col-12 mt-2" type="button" style="background-color: #5651a7; border-color: #5651a7; display:inline-block;">Create Class</button>
            </div>
            <hr class="mt-4">
            <div class="d-flex justify-content-center">
                <button id="btnLogout" class="btn btn-primary col-12 mt-2" type="button" style="background-color: #5651a7; border-color: #5651a7;">Log Out</button>
            </div>
        </div>
    </div>
</form>
