<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RateYourGroup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/litera/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="divLandingPage">
        <header style="background-color: #5651a7;" class="text-white text-center w-100 py-3">
            <div class="container">
                <h4 class="m-0" >RateYourGroup</h4>
            </div>
        </header>
        <main class="d-flex justify-content-center align-items-center flex-column bg-dark">
            <h2 style="color: #5651a7;"class="mt-4 mb-2 p-2">Improve your feedback efficiency:</h2>
            <article class="bg-light text-dark p-4 rounded col-12 col-md-6 col-lg-4" style="overflow-wrap: break-word;">
                <p>placeholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholder</p>
            </article>
            <div class="mt-3 d-flex justify-content-center gap-3 w-100">
                <button id="btnStartRegister" class="btn btn-primary w-100 w-md-25" style="max-width: 200px" type="button">Register</button>
                <button id="btnStartLogin" class="btn btn-primary w-100 w-md-25" style="max-width: 200px" type="button">Log In</button>
            </div>
        </main>
    </div>
    <div class="d-flex justify-content-center align-items-center min-vh-100 bg-dark">
        <form class="card col-12 col-md-6 col-lg-4" id='frmRegistration' style="display:none;">
            <div class="card-body">
                <h2 class="text-center text-primary">RateYourGroup</h2>
                <h4 class="text-center text-primary">Registration</h4>
                <input id="txtFirstName" class="form-control mt-3" type="text" placeholder="First Name" aria-label="Input for first name">
                <p style="color: #ff0033;" class='mt-1 mb-3' id="txtFirstNameError"></p>
                <input id="txtLastName" class="form-control mt-2" type="text" placeholder="Last Name" aria-label="Input for last name">
                <p style="color: #ff0033;" class='mt-1 mb-0'id="txtLastNameError"></p>
                <input id="txtEmail" class="form-control mt-3" type="email" placeholder="Email" aria-label="Input for email">
                <p style="color: #ff0033;" class='mt-1 mb-3'id="txtEmailError"></p>
                <input id="txtPassword" class="form-control mt-2" type="password" placeholder="Password" aria-label="Input for password">
                <div id="divPasswordErrors"></div>
                <input id="txtConfirmPassword" class="form-control mt-2" type="password" placeholder="Confirm Password" aria-label="Input for confirming password">
                <p style="color: #ff0033;" class='mt-1 mb-3'id="txtConfirmPasswordError"></p>
                <hr class="mt-4">
                <button id="btnRegister" class="btn btn-primary col-12 mt-2" type="button">Register</button>
                <button id="btnSwapLogin" class="btn btn-link mt-2 col-12" type="button">Already have an account?</button>
            </div>
        </form>
        <form class="card col-12 col-md-6 col-lg-4" id="frmLogin" style="display:none;">
            <div class="card-body">
                <h2 class="text-center text-primary">RateYourGroup</h2>
                <h4 class="text-center text-primary">Login</h4>
                <input id="txtLoginEmail" class="form-control mt-3" type="email" placeholder="Email" aria-label="Input for email">
                <p style="color: #ff0033;" class='mt-1 mb-2'id="txtLoginEmailError"></p>
                <input id="txtLoginPassword" class="form-control mt-4" type="password" placeholder="Password" aria-label="Input for password">
                <div id="divLoginPasswordErrors"></div>
                <hr class="mt-4">
                <div class="d-flex justify-content-center">
                    <!--TODO: add checkbox that says "Remember me" here 
                    i added a div here and removed col-12 from the other button so they can be side by side on top of the log in-->
                    <button id="btnResetPassword" class="btn btn-link mt-2" type="button">Forgot Password?</button>
                </div>
                <button id="btnLogin" class="btn btn-primary col-12 mt-2" type="button">Log In</button>
                <button id="btnSwapRegistration" class="btn btn-link col-12 mt-2" type="button">Don't have an account? Register Here.</button>
            </div>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/app.js"></script>
    <script src="js/validation.js"></script>
</body>
</html>
